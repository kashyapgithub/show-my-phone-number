name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor CLI & Core
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Web Assets to Android Platform
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: show-my-number-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
