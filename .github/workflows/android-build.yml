name: CI/CD Pipeline (Quality Check, Android Build & Release)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as official GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  # =============================================================
  # STAGE 1: Continuous Integration (Quality & Testing Gate)
  # =============================================================
  quality-check:
    name: CI Quality Gate (Lint, Unit Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Static Type & Lint Check
        run: npm run lint

      - name: Run Automated Unit Tests
        run: npm test

      - name: Production Web Build Verification
        run: npm run build

  # =============================================================
  # STAGE 2: Android Native Compilation
  # =============================================================
  build-android:
    name: Android Compilation & Packaging
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Android Platform
        run: npx cap sync android

      - name: Compile Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: show-number-to-cashier-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # =============================================================
  # STAGE 3: Continuous Delivery (GitHub Releases)
  # =============================================================
  release:
    name: Publish GitHub Release
    needs: [ quality-check, build-android ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Compiled APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: show-number-to-cashier-debug-apk
          path: release-artifacts

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/app-debug.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
